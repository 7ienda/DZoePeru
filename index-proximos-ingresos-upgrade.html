  </div>
</section>

     loadUpcomingProducts() y tickCountdown() en tu index.html

<script id="dzoe-upcoming-js">
// ══════════════════════════════════════════════════════════════
//  PRÓXIMOS INGRESOS — HOME (máx 8, ordenados por prioridad)
// ══════════════════════════════════════════════════════════════
let upcomingProducts = [];
let countdownIntervals = {};
const UC_HOME_MAX = 8;    // máximo en home
const WA_NUM_UC   = '51956063145';

// Favoritos y notificados (compartidos con página full)
let ucFavs     = JSON.parse(localStorage.getItem('dzoe_pi_favs') || '[]');
let ucNotified = JSON.parse(localStorage.getItem('dzoe_pi_notified') || '[]');

const ucPad = n => String(n).padStart(2,'0');
const ucEsc = s => String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');

// ── Carga desde Supabase ────────────────────────────────────
async function loadUpcomingProducts() {
  const cached = getCachedData(CACHE_UP_KEY);
  if (cached && cached.length) {
    upcomingProducts = cached;
    renderUpcomingSection();
  }
  if (!supabaseClient) return;
  try {
    const { data, error } = await supabaseClient
      .from('upcoming_products')
      .select('*')
      .order('estimated_date', { ascending: true });
    if (error) { console.error('❌ upcoming_products:', error.message); return; }
    upcomingProducts = data || [];
    if (upcomingProducts.length) setCachedData(CACHE_UP_KEY, upcomingProducts);
    renderUpcomingSection();
  } catch(e) { console.error('❌ Error upcoming:', e); }
}

// ── Ordenar por prioridad: fecha → reservas → favoritos ─────
function sortByPriority(arr) {
  return [...arr].sort((a, b) => {
    const da = new Date(a.estimated_date), db = new Date(b.estimated_date);
    if (da - db !== 0) return da - db;
    const ra = (b.reservas_count||0) - (a.reservas_count||0);
    if (ra !== 0) return ra;
    return (b.favoritos_count||0) - (a.favoritos_count||0);
  });
}

// ── Render principal ─────────────────────────────────────────
function renderUpcomingSection() {
  const section = document.getElementById('proximos-ingresos');
  const grid    = document.getElementById('upcomingGrid');
  if (!section || !grid) return;

  if (!upcomingProducts.length) { section.style.display = 'none'; return; }
  section.style.display = '';

  // Limpiar timers
  Object.values(countdownIntervals).forEach(clearInterval);
  countdownIntervals = {};

  // Ordenar y limitar a UC_HOME_MAX
  const sorted   = sortByPriority(upcomingProducts);
  const toRender = sorted.slice(0, UC_HOME_MAX);

  grid.innerHTML = toRender.map(up => renderUpcomingCard(up)).join('');

  // Lazy load de imágenes
  grid.querySelectorAll('.uc-lazy').forEach(img => {
    if ('IntersectionObserver' in window) {
      const io = new IntersectionObserver((entries, obs) => {
        entries.forEach(e => {
          if (e.isIntersecting) {
            e.target.src = e.target.dataset.src;
            e.target.onload = () => e.target.classList.add('uc-loaded');
            e.target.onerror = () => { e.target.style.display='none'; };
            obs.unobserve(e.target);
          }
        });
      }, { rootMargin: '180px' });
      io.observe(img);
    } else {
      img.src = img.dataset.src;
      img.classList.add('uc-loaded');
    }
  });

  // Iniciar countdowns
  toRender.forEach(up => {
    const target = new Date(up.estimated_date).getTime();
    if (Date.now() < target) {
      tickCountdown(up.id, target);
      countdownIntervals[up.id] = setInterval(() => tickCountdown(up.id, target), 1000);
    }
  });

  // Animar progress bars
  requestAnimationFrame(() => {
    grid.querySelectorAll('.upcoming-progress-fill[data-pct]').forEach(el => {
      const pct = el.dataset.pct;
      setTimeout(() => { el.style.width = pct + '%'; }, 250);
    });
  });

  // Actualizar botón "Ver todos"
  updateHomeUpcomingBtn();
}

// ── Render de card individual ─────────────────────────────────
function renderUpcomingCard(up) {
  const images    = up.images || (up.image ? [up.image] : []);
  const img0      = images[0] || '';
  const sizes     = up.sizes || [];
  const prices    = sizes.filter(s=>s.price).map(s=>Number(s.price)||0).filter(n=>n>0);
  const minP      = prices.length ? Math.min(...prices) : 0;
  const target    = new Date(up.estimated_date).getTime();
  const isArrived = Date.now() >= target;
  const daysLeft  = Math.ceil((target - Date.now()) / 86400000);
  const reservas  = up.reservas_count || 0;
  const maxRes    = up.reservas_max   || 20;
  const resPct    = Math.min(100, Math.round((reservas / maxRes) * 100));
  const isFav     = ucFavs.includes(String(up.id));
  const isNotify  = ucNotified.includes(String(up.id));

  const dateStr = new Date(up.estimated_date).toLocaleDateString('es-PE', {day:'numeric', month:'long'});

  // Categorías
  const cats     = up.categories || [];
  const catsHtml = cats.length
    ? `<div class="upcoming-cats">${cats.slice(0,3).map(c=>`<span class="upcoming-cat-pill">${ucEsc(c)}</span>`).join('')}</div>`
    : '';

  // Badge imagen
  const badgeTop = isArrived
    ? `<div class="upcoming-badge-arrived">✅ ¡Ya llegó!</div>`
    : `<div class="upcoming-badge-flight">✈️ En camino</div>`;
  const badgeDays = isArrived || daysLeft <= 0 ? '' :
    `<div class="upcoming-badge-days"><span class="uc-days-num">${daysLeft}</span>días</div>`;

  // Imagen
  const imgHtml = img0
    ? `<img data-src="${ucEsc(img0)}" alt="${ucEsc(up.name)}" class="uc-lazy" loading="lazy">`
    : `<div class="upcoming-no-img" aria-hidden="true">📦</div>`;

  // Precio + incentivo
  const priceHtml = minP > 0
    ? `<div>
         <div class="upcoming-price">S/ ${minP.toFixed(2)}</div>
         <div class="upcoming-incentivo"><i class="fas fa-tag"></i> Precio especial antes de llegada</div>
       </div>`
    : '';

  // Progress
  const progressHtml = reservas > 0
    ? `<div class="upcoming-reservas">
         <div class="upcoming-reservas-lbl">
           <span>🔥 <strong>${reservas}</strong>/${maxRes} reservados</span>
           <span style="color:var(--rose);font-weight:800;">${resPct}%</span>
         </div>
         <div class="upcoming-progress-track">
           <div class="upcoming-progress-fill" data-pct="${resPct}" style="width:0%"></div>
         </div>
       </div>` : '';

  // Countdown o arrived
  const waMsg = encodeURIComponent(`Hola D'Zoe Perú 💜 Quiero reservar: *${up.name}*. Fecha estimada: ${dateStr}. ¿Cómo procedo?`);
  const waUrl = `https://wa.me/${WA_NUM_UC}?text=${waMsg}`;

  const cdOrArrived = isArrived
    ? `<div class="upcoming-arrived-msg">🎉 ¡Ya llegó! Pronto en el catálogo.</div>
       <button class="upcoming-promote-btn" onclick="promoteUpcoming('${up.id}')">
         <i class="fas fa-arrow-up-from-bracket"></i> Pasar a productos
       </button>`
    : `<div class="upcoming-countdown" id="cd-${up.id}">
         <span class="upcoming-cd-label">Llega en</span>
         <div class="cd-block"><span class="cd-num" id="cd-d-${up.id}">--</span><span class="cd-label">días</span></div>
         <span class="upcoming-cd-sep">:</span>
         <div class="cd-block"><span class="cd-num" id="cd-h-${up.id}">--</span><span class="cd-label">hrs</span></div>
         <span class="upcoming-cd-sep">:</span>
         <div class="cd-block"><span class="cd-num" id="cd-m-${up.id}">--</span><span class="cd-label">min</span></div>
       </div>`;

  // Fecha row
  const dateRow = `<div class="upcoming-date-row">
    <i class="fas fa-calendar-check"></i>
    Llega aprox. <strong>${dateStr}</strong>
  </div>`;

  // Action buttons
  const actionBtns = isArrived ? '' : `
    <a href="${waUrl}" target="_blank" rel="noopener" class="upcoming-wa-btn">
      <i class="fab fa-whatsapp"></i> Reservar ahora
    </a>
    <div class="upcoming-row-btns">
      <button class="upcoming-fav-btn ${isFav?'active':''}" id="ucfav-${up.id}"
        onclick="ucToggleFav('${up.id}',this)"
        aria-label="Favoritos" aria-pressed="${isFav}">
        <i class="${isFav?'fas':'far'} fa-heart"></i> ${isFav?'Guardado':'💝 Favoritos'}
      </button>
      <button class="upcoming-notify-btn ${isNotify?'active':''}" id="ucnotify-${up.id}"
        onclick="ucToggleNotify('${up.id}',this,'${ucEsc(up.name)}')"
        aria-label="Avisarme" aria-pressed="${isNotify}">
        <i class="fas fa-bell"></i> ${isNotify?'Avisado':'🔔 Avisarme'}
      </button>
    </div>`;

  return `
  <article class="upcoming-card" id="upcoming-card-${up.id}" aria-label="${ucEsc(up.name)}">
    <div class="upcoming-img-wrap">
      ${badgeTop}
      ${badgeDays}
      ${imgHtml}
      <div class="upcoming-img-glow" aria-hidden="true"></div>
    </div>
    <div class="upcoming-body">
      ${catsHtml}
      <h3 class="upcoming-name">${ucEsc(up.name)}</h3>
      ${up.description ? `<div class="upcoming-desc" style="font-size:11.5px;color:var(--text-soft);font-weight:600;line-height:1.5;">${ucEsc(up.description)}</div>` : ''}
      ${dateRow}
      ${priceHtml}
      ${progressHtml}
      ${cdOrArrived}
      <div class="upcoming-actions">
        ${actionBtns}
      </div>
    </div>
  </article>`;
}

// ── Countdown tick ────────────────────────────────────────────
function tickCountdown(id, target) {
  const diff = target - Date.now();
  if (diff <= 0) {
    clearInterval(countdownIntervals[id]);
    const cdEl = document.getElementById(`cd-${id}`);
    if (cdEl) cdEl.outerHTML =
      `<div class="upcoming-arrived-msg">🎉 ¡Ya llegó! Pronto en el catálogo.</div>
       <button class="upcoming-promote-btn" onclick="promoteUpcoming('${id}')">
         <i class="fas fa-arrow-up-from-bracket"></i> Pasar a productos
       </button>`;
    const badge = document.querySelector(`#upcoming-card-${id} .upcoming-badge-flight`);
    if (badge) { badge.className='upcoming-badge-arrived'; badge.textContent='✅ ¡Ya llegó!'; }
    return;
  }
  const d=Math.floor(diff/86400000), h=Math.floor((diff%86400000)/3600000), m=Math.floor((diff%3600000)/60000);
  const dEl=document.getElementById(`cd-d-${id}`);
  const hEl=document.getElementById(`cd-h-${id}`);
  const mEl=document.getElementById(`cd-m-${id}`);
  if(dEl) dEl.textContent=ucPad(d);
  if(hEl) hEl.textContent=ucPad(h);
  if(mEl) mEl.textContent=ucPad(m);
}

// ── Actualizar texto del botón ver todos ──────────────────────
function updateHomeUpcomingBtn() {
  const pill = document.getElementById('upcomingTotalPill');
  const btn  = document.getElementById('upcomingVerTodosBtn');
  if (!pill || !btn) return;
  const total = upcomingProducts.length;
  if (total > UC_HOME_MAX) {
    pill.textContent = total + '+ ingresos';
    btn.style.display = '';
  } else if (total > 0) {
    pill.textContent = total + ' ingresos';
    btn.style.display = '';
  } else {
    btn.closest('.upcoming-footer-row').style.display = 'none';
  }
}

// ── Favoritos & Notificaciones (home) ─────────────────────────
window.ucToggleFav = function(id, btn) {
  const idx = ucFavs.indexOf(String(id));
  if (idx === -1) {
    ucFavs.push(String(id));
    btn.innerHTML = '<i class="fas fa-heart"></i> Guardado';
    btn.classList.add('active');
    btn.setAttribute('aria-pressed','true');
    if (typeof showToast === 'function') showToast('💝 Agregado a favoritos');
    else { const t = document.createElement('div'); t.textContent='💝 Guardado'; t.style.cssText='position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#2D2545;color:#fff;padding:10px 20px;border-radius:12px;z-index:9999;font-weight:700;font-family:Nunito,sans-serif;'; document.body.appendChild(t); setTimeout(()=>t.remove(),2500); }
    if (supabaseClient) supabaseClient.rpc('increment_favoritos', {row_id: id}).catch(()=>{});
  } else {
    ucFavs.splice(idx,1);
    btn.innerHTML = '<i class="far fa-heart"></i> 💝 Favoritos';
    btn.classList.remove('active');
    btn.setAttribute('aria-pressed','false');
  }
  localStorage.setItem('dzoe_pi_favs', JSON.stringify(ucFavs));
};

window.ucToggleNotify = function(id, btn, name) {
  const idx = ucNotified.indexOf(String(id));
  if (idx === -1) {
    ucNotified.push(String(id));
    btn.innerHTML = '<i class="fas fa-bell"></i> Avisado';
    btn.classList.add('active');
    btn.setAttribute('aria-pressed','true');
    const waMsg = encodeURIComponent(`Hola D'Zoe Perú 💜 Quiero que me avisen cuando llegue: *${name}*. Por favor anótenme.`);
    setTimeout(() => window.open(`https://wa.me/${WA_NUM_UC}?text=${waMsg}`,'_blank'), 400);
  } else {
    ucNotified.splice(idx,1);
    btn.innerHTML = '<i class="fas fa-bell"></i> 🔔 Avisarme';
    btn.classList.remove('active');
    btn.setAttribute('aria-pressed','false');
  }
  localStorage.setItem('dzoe_pi_notified', JSON.stringify(ucNotified));
};

// ── promoteUpcoming (igual que antes, compatible) ─────────────
async function promoteUpcoming(id) {
  if (!confirm('¿Pasar este producto a la tienda como producto disponible?')) return;
  if (!supabaseClient) { alert('No hay conexión con Supabase'); return; }
  const up = upcomingProducts.find(u => String(u.id)===String(id));
  if (!up) return;
  const productData = {
    id: Date.now(), name: up.name, description: up.description||'',
    images: up.images||[], image: (up.images||[])[0]||up.image||'',
    featured: up.featured||false, status: 'active', categories: up.categories||[],
    sizes: (up.sizes||[]).map(s=>({size:s.size,price:s.price,cost:s.cost||0,stock:s.stock||0})),
    is_new: true, created_at: new Date().toISOString()
  };
  const {error: iErr} = await supabaseClient.from('products').insert([productData]);
  if (iErr) { alert('Error al crear el producto: '+iErr.message); return; }
  const {error: dErr} = await supabaseClient.from('upcoming_products').delete().eq('id', id);
  if (dErr) { alert('Error al eliminar de próximos: '+dErr.message); return; }
  alert('✅ Producto pasado a la tienda correctamente.');
  upcomingProducts = upcomingProducts.filter(u => String(u.id)!==String(id));
  renderUpcomingSection();
  if (typeof loadAllData === 'function') loadAllData();
}
</script>
