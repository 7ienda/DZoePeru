name: Generar páginas de producto

on:
  # Botón manual en la pestaña "Actions" de GitHub
  workflow_dispatch:
  # Corre automáticamente todos los días a las 9:00am hora Perú (14:00 UTC)
  schedule:
    - cron: '0 14 * * *'

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Clonar repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install

      - name: Generar páginas de producto
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: npm run generate

      - name: Confirmar y subir cambios (si hay)
        run: |
          git config user.name "dzoe-bot"
          git config user.email "bot@dzoeperu.com"
          git add productos sitemap.xml products.json
          git diff --staged --quiet || git commit -m "🤖 Auto: actualizar páginas de producto $(date +'%Y-%m-%d %H:%M')"
          git push
