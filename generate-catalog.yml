name: Generate Meta Commerce Catalog

on:
  schedule:
    # Regenerar el catálogo cada 6 horas
    - cron: '0 */6 * * *'
  workflow_dispatch:   # También se puede ejecutar manualmente desde GitHub

jobs:
  build-catalog:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm install @supabase/supabase-js

      - name: Generate catalog.xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: node generate-catalog.js

      - name: Commit and push catalog.xml
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add catalog.xml
          git diff --cached --quiet || git commit -m "chore: regenerar catalog.xml [skip ci]"
          git push
