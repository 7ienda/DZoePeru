# .github/workflows/generate-feed.yml
# Regenera feed.xml automáticamente desde Supabase
#
# Se ejecuta:
#   - Cada día a las 8am hora Perú (13:00 UTC)
#   - Cada vez que haces push a main
#   - Manualmente desde la pestaña Actions

name: Generar feed.xml

on:
  schedule:
    - cron: "0 13 * * *"   # 8:00 AM Perú (UTC-5) todos los días
  push:
    branches: [main]
    paths:
      - "generate-feed.js" # también si editas el script
  workflow_dispatch:        # botón manual en GitHub Actions

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repositorio
        uses: actions/checkout@v4

      - name: Instalar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Generar feed.xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
        run: node generate-feed.js

      - name: Subir feed.xml al repositorio
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add feed.xml
          git diff --staged --quiet || git commit -m "🤖 Actualizar feed.xml [$(date '+%Y-%m-%d')]"
          git push
