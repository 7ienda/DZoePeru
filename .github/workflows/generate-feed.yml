name: Generar feed.xml para Google Merchant

on:
  # 1) Se regenera automáticamente cada 6 horas
  schedule:
    - cron: '0 */6 * * *'

  # 2) También se regenera cada vez que haces push a main
  push:
    branches: [main]

  # 3) Puedes dispararlo manualmente desde GitHub → Actions → "Run workflow"
  workflow_dispatch:

jobs:
  build-feed:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repositorio
        uses: actions/checkout@v4

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Instalar dependencias
        run: npm install @supabase/supabase-js

      - name: Generar feed.xml
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON: ${{ secrets.SUPABASE_ANON }}
        run: node generate-feed.js

      - name: Hacer commit y push del feed.xml actualizado
        run: |
          git config user.name "GitHub Actions"
          git config user.email "actions@github.com"
          git add feed.xml
          # Solo hace commit si feed.xml cambió
          git diff --staged --quiet || git commit -m "chore: regenerar feed.xml [skip ci]"
          git push
